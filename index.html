<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <title>foot-guun — generator stopek mailowych</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div>
        <h1 class="brand">
          foot<span class="brand-accent">-guun</span>
          <span class="badge">FOR DATADISE</span>
        </h1>
        <p class="tagline">Generator stopek mailowych. Celuj ostrożnie.</p>
      </div>
    </header>

    <main class="app">
      <div class="columns">
        <section class="panel" aria-labelledby="form-title">
          <h2 id="form-title" class="panel-title">Twoje dane</h2>
          <form id="signature-form" class="form" autocomplete="on">
            <label class="field">
              <span class="field-label">Imię i nazwisko</span>
              <input
                type="text"
                name="name"
                placeholder="Dżejson Kowalski"
                autocomplete="name" />
            </label>
            <label class="field">
              <span class="field-label">Stanowisko</span>
              <input
                type="text"
                name="title"
                placeholder="Head of Self-Inflicted Wounds"
                autocomplete="organization-title" />
            </label>
            <label class="field">
              <span class="field-label">Numer telefonu</span>
              <input
                type="tel"
                name="phone"
                placeholder="000 000 000"
                autocomplete="tel" />
            </label>
            <label class="field">
              <span class="field-label">Email</span>
              <input
                type="email"
                name="email"
                placeholder="kooooooooowalski@opc.je"
                autocomplete="email" />
            </label>
            <fieldset class="field radio-group">
              <legend class="field-label">Kafelek z logo</legend>
              <label class="radio">
                <input type="radio" name="logoTile" value="accent" checked />
                <span>Turkusowy</span>
              </label>
              <label class="radio">
                <input type="radio" name="logoTile" value="black" />
                <span>Czarny</span>
              </label>
              <label class="radio">
                <input type="radio" name="logoTile" value="white" />
                <span>Biały</span>
              </label>
            </fieldset>
          </form>
        </section>

        <section
          id="preview-panel"
          class="panel client-preview"
          data-client="dark"
          aria-labelledby="preview-title">
          <div class="preview-head">
            <h2 id="preview-title" class="panel-title">Podgląd</h2>
            <button
              type="button"
              id="preview-theme-switch"
              class="theme-switch preview-theme-switch"
              role="switch"
              aria-checked="false"
              aria-label="Jasny klient poczty">
              <span class="preview-theme-label preview-theme-dark">Dark</span>
              <span class="theme-switch-track" aria-hidden="true">
                <span class="theme-switch-thumb"></span>
              </span>
              <span class="preview-theme-label preview-theme-light">Light</span>
            </button>
          </div>
          <div class="preview-frame">
            <div id="preview" class="preview"></div>
          </div>
        </section>
      </div>

      <section class="exports" aria-label="Eksport">
        <div class="panel export">
          <h2 class="panel-title export-title">HTML code</h2>
          <p class="hint">Outlook, Apple Mail, Thunderbird, Missive i inne.</p>
          <div class="btn-group">
            <button type="button" class="btn" data-copy="html">Kopiuj kod</button>
            <button type="button" class="btn btn-secondary" data-code="html">
              Pokaż kod
            </button>
          </div>
        </div>

        <div class="panel export">
          <h2 class="panel-title export-title">Rich text</h2>
          <p class="hint">
            Gmail, Roundcube i inne.
          </p>
          <div class="btn-group">
            <button type="button" class="btn" data-copy="rich">Kopiuj</button>
          </div>
        </div>
      </section>
    </main>

    <dialog id="code-dialog" class="dialog" aria-labelledby="code-dialog-title">
      <div class="dialog-body">
        <div class="dialog-head">
          <h2 id="code-dialog-title" class="panel-title">HTML code</h2>
          <form method="dialog">
            <button type="submit" class="dialog-close" aria-label="Zamknij">
              ×
            </button>
          </form>
        </div>
        <textarea
          id="code-dialog-code"
          class="code"
          rows="16"
          readonly
          spellcheck="false"
          aria-label="Kod HTML stopki"></textarea>
        <div class="btn-group">
          <button type="button" class="btn" data-copy="html">Kopiuj</button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
